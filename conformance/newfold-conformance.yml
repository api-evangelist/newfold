- id: oauth2.1
  name: OAuth 2.1 (authorization code + PKCE)
  conforms: true
  evidence: '@newfold/wp-mcp-connector implements the authorization-code flow with
    PKCE (S256) always on; an implicit flow is retained only as a legacy option for
    older sites.'
  source: https://www.npmjs.com/package/@newfold/wp-mcp-connector
- id: rfc7636
  name: PKCE
  conforms: true
  evidence: S256 challenge method, always enabled for authorization_code.
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  conforms_as: client
  evidence: The connector discovers protected-resource metadata first, before falling
    back to RFC 8414.
