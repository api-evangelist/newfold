- id: rfc7591
  name: OAuth 2.0 Dynamic Client Registration
  conforms: true
  conforms_as: client
  evidence: Runs automatically when no WP_OAUTH_CLIENT_ID is supplied and the authorization
    server advertises a registration endpoint.
