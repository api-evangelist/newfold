apis:
- aid: newfold:blu-mcp
  name: Newfold BLU MCP Server (WordPress)
  description: 'The Newfold Labs WordPress MCP module (wp-module-mcp) registers an
    MCP server, id blu-mcp, on the WordPress REST route /wp-json/blu/mcp of every site
    running a Newfold brand plugin. It exposes WordPress Abilities API abilities as
    MCP tools through a three-tool gateway (list abilities, get ability schema, call
    ability) plus a generic REST CRUD surface, covering posts, pages, media, custom
    post types, users, settings, site info, themes, global styles and WooCommerce products,
    orders and reports. Because the server ships inside the customer''s own WordPress
    install, the endpoint host is the customer domain rather than a Newfold-hosted URL.'
  humanURL: https://github.com/newfold-labs/wp-module-mcp
  baseURL: https://{site}/wp-json/blu/mcp
  x-base-url-note: Templated. The MCP server is self-hosted on each customer WordPress
    site by the Newfold brand plugin; Newfold publishes no central endpoint. The provider's
    own README uses https://YOUR-SITE.com/wp-json/blu/mcp.
  tags:
  - MCP
  - WordPress
  - Agents
  - E-Commerce
  tags_raw:
  - Model Context Protocol
  - WordPress
  - Agents
  - eCommerce
  properties:
