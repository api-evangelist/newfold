name: Newfold
description: 'Newfold Digital is a web presence and technology solutions company serving
  small and medium businesses worldwide with domain registration, web hosting, website
  building, e-commerce, security, and digital marketing. It was formed in 2021 from
  the merger of Web.com Group and Endurance International Group and operates a portfolio
  of consumer and reseller brands including Bluehost, HostGator, Network Solutions,
  Register.com, Web.com, and Domain.com. The corporate site newfold.com is an investor
  and company presence rather than a unified developer portal, and it sits behind a
  Cloudflare interactive challenge. The company''s real public developer surface is
  Newfold Labs (github.com/newfold-labs), an 85-repository engineering org that ships
  the brand WordPress plugins, a Composer module fleet distributed from its own Satis
  registry, public npm packages under the @newfold scope, a published engineering
  standards site with an llms.txt, and an MCP server module that exposes WordPress
  abilities to AI assistants from each customer site.'
