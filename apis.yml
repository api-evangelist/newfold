- aid: newfold:hiive
  name: Hiive Platform API
  description: 'Hiive is Newfold''s site-connection platform API. The GPL-licensed
    Newfold data module (wp-module-data), installed on every site running a Newfold
    brand plugin, defines the base https://hiive.cloud/api and calls paths such as
    sites/v1/events, sites/v2/events, and the capabilities and verify routes to register
    a site, exchange a token and stream events back to Newfold. The base URL and the
    request shapes are readable in the module''s public source; Newfold publishes no
    external developer documentation, no OpenAPI, and no self-service credentials for
    it.'
  humanURL: https://github.com/newfold-labs/wp-module-data
  baseURL: https://hiive.cloud/api
  x-base-url-note: Read from NFD_HIIVE_URL in includes/HiiveConnection.php of the first-party
    GPL module newfold-labs/wp-module-data. Probed live 2026-08-13; the host answers
    (404 on unknown paths) and is not behind the Cloudflare challenge that fronts newfold.com.
  tags:
  - Telemetry
  - WordPress
  - Platform
  properties:
  - type: SourceCode
    url: https://github.com/newfold-labs/wp-module-data
  - type: Documentation
    url: https://github.com/newfold-labs/wp-module-data/blob/main/README.md
- aid: newfold:huapi
  name: HUAPI (Hosting Unified API)
  description: 'HUAPI is Newfold''s internal hosting control-plane API, versioned under
    /v1, covering account, hosting, sites, domains, addons (backup, CodeGuard, SiteLock,
    Xcitium, Cloudflare, SpamExperts, Jetpack), announcements, logs and public keys.
    Newfold publishes a generated JavaScript client for it on npm as @newfold/huapi-js
    — 389 published versions, built with Orval from an openapi.json — but the package
    README states the spec is pulled from a beta server that requires the corporate
    VPN, so the OpenAPI itself is not public and no public base URL is published.'
  humanURL: https://www.npmjs.com/package/@newfold/huapi-js
  x-base-url-note: 'No public base URL. The published client sets no baseURL of its
    own (paths are relative, e.g. /v1/account/hosting) and Newfold''s own README says
    the OpenAPI is fetched from an internal beta server over VPN. Recorded as missing
    rather than guessed.'
  tags:
  - Hosting
  - Control Plane
  - Internal
  properties:
  - type: SDKs
    url: https://www.npmjs.com/package/@newfold/huapi-js
